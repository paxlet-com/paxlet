[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paxlet"
version = "0.1.4"
description = "Small, addressable packages of resources and actions for connected systems."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Paxlet contributors"}, {name = "Tom Sapletta",email = "tom@sapletta.com"}]
dependencies = []
license = "Apache-2.0"

[project.scripts]
paxlet = "paxlet.cli:main"

[tool.setuptools]
packages = ["paxlet"]

[tool.costs]
# AI Cost tracking configuration
badge = true
update_readme = true
readme_path = "README.md"
default_model = "openrouter/qwen/qwen3-coder-next"
analysis_mode = "byok"
full_history = true
max_commits = 500

# Cost thresholds for badge colors (USD)
badge_color_thresholds = { low = 1.0, medium = 5.0, high = 10.0, critical = 50.0 }

[tool.wellmanifest]
standard = "0.20.52"
revision = "980f6e5f73c923f2959c266b84de9ffc544671de"
gate = "project/governance-check.sh"

[tool.pytest.ini_options]
addopts = "-p wellmanifest_governance"
testpaths = ["tests"]
pythonpath = ["."]

